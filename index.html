<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amgad Nady | Software Engineer & Flutter Developer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
         :root {
            --primary: #00aaff;
            --primary-light: #e6f7ff;
            --secondary: #5100ff;
            --dark: #121212;
            --light: #f8f9fa;
            --gray: #6c757d;
            --gray-light: #e9ecef;
            --dark-transparent: rgba(0, 0, 0, 0.85);
            --light-transparent: rgba(248, 249, 250, 0.85);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-light: rgba(0, 0, 0, 0.05);
          --background-image: url("./flutter-background.webp");
            --overlay-gradient: linear-gradient(135deg, rgba(0, 10, 20, 0.9) 0%, rgba(0, 40, 80, 0.7) 100%);
            --text-color: #f8f9fa;
            --text-color-dark: #121212;
        }

        :root[data-theme="light"] {
            --primary: #0077cc;
            --primary-light: #f0f9ff;
            --secondary: #3a00ff;
            --dark: #ffffff;
            --light: #333;
            --gray: #495057;
            --gray-light: #f8f9fa;
            --dark-transparent: rgba(255, 255, 255, 0.85);
            --light-transparent: rgba(33, 37, 41, 0.85);
            --glass: rgba(0, 0, 0, 0.03);
            --glass-light: rgba(0, 0, 0, 0.03);
            --background-image: url("./flutter-background.webp");
            --overlay-gradient: rgba(255, 255, 255, 0.96);
            --text-color: #333;
            --text-color-dark: rgb(248, 249, 250);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }
        body {
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            color: var(--text-color);
            background-image: var(--background-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            line-height: 1.6;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay-gradient);
            z-index: -1;
        }
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 1rem 2rem;
            background-color: var(--dark-transparent);
            backdrop-filter: blur(10px);
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        nav.scrolled {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1200px;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            white-space: nowrap;
        }
        .nav-links {
            display: flex;
            gap: 1rem;
            margin: 0 auto;
            align-items: center;
        }
        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.3s ease;
            padding: 0.5rem 0.8rem;
            border-radius: 4px;
            white-space: nowrap;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary);
            background-color: rgba(0, 170, 255, 0.1);
        }
        .theme-switch {
            margin-left: 1rem;
        }
        /* Theme switch minimal visual styles */
        .theme-switch {
            cursor: pointer;
            user-select: none;
        }
        .theme-switch__checkbox {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
               /* Theme Toggle Switch */
        .theme-switch {
            --toggle-size: 20px;
            --container-width: 3.5em;
            --container-height: 1.8em;
            --container-radius: 6.25em;
            --container-light-bg: #3D7EAE;
            --container-night-bg: #1D1F2C;
            --circle-container-diameter: 2.2em;
            --sun-moon-diameter: 1.4em;
            --sun-bg: #ECCA2F;
            --moon-bg: #C4C9D1;
            --spot-color: #959DB1;
            --circle-container-offset: calc((var(--circle-container-diameter) - var(--container-height)) / 2 * -1);
            --stars-color: #fff;
            --clouds-color: #F3FDFF;
            --back-clouds-color: #AACADF;
            --transition: .3s cubic-bezier(0, -0.02, 0.4, 1.25);
            --circle-transition: .2s cubic-bezier(0, -0.02, 0.35, 1.17);
            margin-left: 1rem;
        }

        .theme-switch, .theme-switch *, .theme-switch *::before, .theme-switch *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-size: var(--toggle-size);
        }

        .theme-switch__container {
            width: var(--container-width);
            height: var(--container-height);
            background-color: var(--container-light-bg);
            border-radius: var(--container-radius);
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0em -0.062em 0.062em rgba(0, 0, 0, 0.25), 0em 0.062em 0.125em rgba(255, 255, 255, 0.94);
            transition: var(--transition);
            position: relative;
        }

        .theme-switch__container::before {
            content: "";
            position: absolute;
            z-index: 1;
            inset: 0;
            box-shadow: 0em 0.05em 0.187em rgba(0, 0, 0, 0.25) inset, 0em 0.05em 0.187em rgba(0, 0, 0, 0.25) inset;
            border-radius: var(--container-radius)
        }

        .theme-switch__checkbox {
            display: none;
        }

        .theme-switch__circle-container {
            width: var(--circle-container-diameter);
            height: var(--circle-container-diameter);
            background-color: rgba(255, 255, 255, 0.1);
            position: absolute;
            left: var(--circle-container-offset);
            top: var(--circle-container-offset);
            border-radius: var(--container-radius);
            box-shadow: inset 0 0 0 3.375em rgba(255, 255, 255, 0.1), inset 0 0 0 3.375em rgba(255, 255, 255, 0.1), 0 0 0 0.625em rgba(255, 255, 255, 0.1), 0 0 0 1.25em rgba(255, 255, 255, 0.1);
            display: flex;
            transition: var(--circle-transition);
            pointer-events: none;
        }

        .theme-switch__sun-moon-container {
            pointer-events: auto;
            position: relative;
            z-index: 2;
            width: var(--sun-moon-diameter);
            height: var(--sun-moon-diameter);
            margin: auto;
            border-radius: var(--container-radius);
            background-color: var(--sun-bg);
            box-shadow: 0.062em 0.062em 0.062em 0em rgba(254, 255, 239, 0.61) inset, 0em -0.062em 0.062em 0em #a1872a inset;
            filter: drop-shadow(0.062em 0.125em 0.125em rgba(0, 0, 0, 0.25)) drop-shadow(0em 0.062em 0.125em rgba(0, 0, 0, 0.25));
            overflow: hidden;
            transition: var(--transition);
        }

        .theme-switch__moon {
            transform: translateX(100%);
            width: 100%;
            height: 100%;
            background-color: var(--moon-bg);
            border-radius: inherit;
            box-shadow: 0.062em 0.062em 0.062em 0em rgba(254, 255, 239, 0.61) inset, 0em -0.062em 0.062em 0em #969696 inset;
            transition: var(--transition);
            position: relative;
        }

        .theme-switch__spot {
            position: absolute;
            top: 0.5em;
            left: 0.2em;
            width: 0.5em;
            height: 0.5em;
            border-radius: var(--container-radius);
            background-color: var(--spot-color);
            box-shadow: 0em 0.0312em 0.062em rgba(0, 0, 0, 0.25) inset;
        }

        .theme-switch__spot:nth-of-type(2) {
            width: 0.25em;
            height: 0.25em;
            top: 0.6em;
            left: 0.9em;
        }

        .theme-switch__spot:nth-last-of-type(3) {
            width: 0.15em;
            height: 0.15em;
            top: 0.2em;
            left: 0.5em;
        }

        .theme-switch__clouds {
            width: 0.8em;
            height: 0.8em;
            background-color: var(--clouds-color);
            border-radius: var(--container-radius);
            position: absolute;
            bottom: -0.4em;
            left: 0.2em;
            box-shadow: 0.6em 0.2em var(--clouds-color), -0.2em -0.2em var(--back-clouds-color), 0.9em 0.25em var(--clouds-color), 0.3em -0.1em var(--back-clouds-color), 1.4em 0 var(--clouds-color), 0em 0.8em var(--back-clouds-color);
            transition: var(--transition);
        }

        .theme-switch__stars-container {
            position: absolute;
            color: var(--stars-color);
            top: -100%;
            left: 0.2em;
            width: 1.8em;
            height: auto;
            transition: var(--transition);
        }

        /* Toggle actions */
        .theme-switch__checkbox:checked + .theme-switch__container {
            background-color: var(--container-night-bg);
        }

        .theme-switch__checkbox:checked + .theme-switch__container .theme-switch__circle-container {
            left: calc(100% - var(--circle-container-offset) - var(--circle-container-diameter));
        }

        .theme-switch__checkbox:checked + .theme-switch__container .theme-switch__circle-container:hover {
            left: calc(100% - var(--circle-container-offset) - var(--circle-container-diameter) - 0.12em)
        }

        .theme-switch__circle-container:hover {
            left: calc(var(--circle-container-offset) + 0.12em);
        }

        .theme-switch__checkbox:checked + .theme-switch__container .theme-switch__moon {
            transform: translate(0);
        }

        .theme-switch__checkbox:checked + .theme-switch__container .theme-switch__clouds {
            bottom: -2.6em;
        }

        .theme-switch__checkbox:checked + .theme-switch__container .theme-switch__stars-container {
            top: 50%;
            transform: translateY(-50%);
        }
        
        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 6rem 1.5rem 2rem;
            position: relative;
        }
        .hero-content {
            max-width: 800px;
            margin: 0 auto;
        }
        .hero h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, var(--primary), #00ccff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: fadeIn 1s ease;
            line-height: 1.2;
        }
        .hero h2 {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 400;
            margin-bottom: 1.5rem;
            color: var(--text-color);
            opacity: 0.9;
            animation: fadeIn 1.2s ease;
        }
        .hero p {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            max-width: 600px;
            margin: 0 auto 2rem;
            color: var(--gray);
            animation: fadeIn 1.4s ease;
        }
        .cta-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
            animation: fadeIn 1.6s ease;
            flex-wrap: wrap;
        }
        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: clamp(0.9rem, 2vw, 1rem);
        }
        .btn-primary {
            background-color: var(--primary);
            color: var(--text-color-dark);
            box-shadow: 0 4px 15px rgba(0, 170, 255, 0.4);
        }
        .btn-primary:hover {
            background-color: #0088cc;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 170, 255, 0.6);
        }
        .btn-secondary {
            background-color: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn-secondary:hover {
            background-color: rgba(0, 170, 255, 0.1);
            transform: translateY(-3px);
        }
        .social-links {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-top: 3rem;
            flex-wrap: wrap;
        }
        .social-links a {
            color: var(--text-color);
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }
        .social-links a:hover {
            color: var(--primary);
            transform: translateY(-3px);
        }
        section {
            padding: 4rem 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .section-title {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 3rem;
            position: relative;
            display: inline-block;
            color: var(--primary);
        }
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 60%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), transparent);
            border-radius: 2px;
        }
        /* About Section */
        .about-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            align-items: center;
        }
        .about-text p {
            margin-bottom: 1.5rem;
            font-size: 1rem;
            line-height: 1.8;
            color: var(--text-color);
        }
        .about-image {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: 0 auto;
        }
        .about-image img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s ease;
        }
        .about-image:hover img {
            transform: scale(1.05);
        }
        .skills-highlight ul{
            padding-left: 20px;
        }
        /* Skills Section */
        .skills-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        .skill-category {
            background-color: var(--glass);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }
        .skill-category:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }
        .skill-category h3 {
            font-size: 1.2rem;
            margin-bottom: 1.2rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .skill-category ul {
            list-style-type: none;
        }
        .skill-category li {
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.95rem;
            color: var(--text-color);
        }
        .skill-category li::before {
            content: '▹';
            color: var(--primary);
        }
        /* Projects Section - Redesigned Grid Layout */
        .projects-section {
            padding-bottom: 2rem;
            position: relative;
            max-width: 1400px;
        }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            padding: 0.5rem;
        }
        .project-card {
            background-color: var(--glass);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            height: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }
        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .project-card:hover::before {
            opacity: 1;
        }
        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 170, 255, 0.2);
        }
        .project-image-container {
            position: relative;
            width: 100%;
            height: 180px;
            overflow: hidden;
        }
        .project-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .project-card:hover img {
            transform: scale(1.1);
        }
        .project-image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.7) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .project-card:hover .project-image-overlay {
            opacity: 1;
        }
        .project-info {
            padding: 1.25rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .project-info h3 {
            font-size: 1.15rem;
            font-weight: 600;
            margin: 0;
            color: var(--primary);
            line-height: 1.3;
        }
        .project-info p {
            margin: 0;
            color: var(--gray);
            font-size: 0.875rem;
            line-height: 1.5;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .project-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: auto;
        }
        .tech-tag {
            background: linear-gradient(135deg, rgba(0, 170, 255, 0.15) 0%, rgba(81, 0, 255, 0.15) 100%);
            color: var(--primary);
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
            border: 1px solid rgba(0, 170, 255, 0.2);
            transition: all 0.2s ease;
        }
        .tech-tag:hover {
            background: linear-gradient(135deg, rgba(0, 170, 255, 0.25) 0%, rgba(81, 0, 255, 0.25) 100%);
            transform: translateY(-1px);
        }
        .project-links {
            display: flex;
            gap: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 0.5rem;
        }
        .project-links a {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.8rem;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            background: rgba(0, 170, 255, 0.1);
            transition: all 0.3s ease;
        }
        .project-links a:hover {
            background: var(--primary);
            color: var(--text-color-dark);
            transform: translateY(-2px);
        }
        .project-links a i {
            font-size: 0.9rem;
        }
        /* Hide navigation buttons - no longer needed with grid */
        .projects-nav {
            display: none;
        }
        
        /* Featured project - spans 2 columns on larger screens */
        .project-card.featured {
            grid-column: span 1;
        }
        
        @media (min-width: 768px) {
            .projects-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 2rem;
            }
            .project-card.featured {
                grid-column: span 2;
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
            .project-card.featured .project-image-container {
                height: 100%;
                min-height: 280px;
            }
            .project-card.featured .project-info {
                padding: 1.5rem;
                justify-content: center;
            }
            .project-card.featured .project-info p {
                -webkit-line-clamp: 5;
            }
        }
        
        @media (min-width: 1024px) {
            .projects-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .project-card.featured {
                grid-column: span 2;
            }
        }
        
        @media (max-width: 576px) {
            .projects-grid {
                grid-template-columns: 1fr;
                gap: 1.25rem;
                padding: 0;
            }
            .project-card {
                border-radius: 12px;
            }
            .project-image-container {
                height: 160px;
            }
            .project-info {
                padding: 1rem;
            }
            .project-info h3 {
                font-size: 1.1rem;
            }
            .project-info p {
                font-size: 0.85rem;
                -webkit-line-clamp: 2;
            }
            .tech-tag {
                font-size: 0.65rem;
                padding: 0.2rem 0.5rem;
            }
            .project-links {
                flex-wrap: wrap;
            }
            .project-links a {
                font-size: 0.75rem;
                padding: 0.35rem 0.65rem;
            }
        }
        
        @media (max-width: 400px) {
            .project-image-container {
                height: 140px;
            }
            .project-info {
                padding: 0.875rem;
                gap: 0.5rem;
            }
        }
        
        /* Timeline Section */
        .timeline {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
        }
        .timeline::before {
            content: '';
            position: absolute;
            top: 0;
            left: 30px;
            width: 2px;
            height: 100%;
            background-color: var(--primary);
        }
        .timeline-item {
            position: relative;
            margin-bottom: 2rem;
            width: 100%;
            padding-left: 70px;
            text-align: left;
        }
        .timeline-content {
            background-color: var(--glass);
            backdrop-filter: blur(10px);
            padding: 1.2rem;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            position: relative;
        }
        .timeline-content::before {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background-color: var(--primary);
            border-radius: 50%;
            top: 20px;
            left: -43px;
        }
        .timeline-date {
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        .timeline-title {
            font-size: 1.2rem;
            margin-bottom: 0.6rem;
            color: var(--text-color);
        }
        .timeline-content p {
            font-size: 0.95rem;
            color: var(--gray);
        }
        /* Contact Section */
        .contact-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }
        .contact-info {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.2rem;
        }
        .contact-card {
            background-color: var(--glass);
            backdrop-filter: blur(10px);
            padding: 1.2rem;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.3s ease;
        }
        .contact-card a {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--text-color);
            text-decoration: none;
            width: 100%;
        }
        .contact-card a:hover {
            color: var(--primary);
        }
        .contact-card:hover {
            transform: translateY(-5px);
            background-color: rgba(0, 170, 255, 0.1);
        }
        .contact-icon {
            font-size: 1.3rem;
            color: var(--primary);
            min-width: 36px;
            text-align: center;
        }
        .contact-text h3 {
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
            color: var(--text-color);
        }
        .contact-text a, 
        .contact-text p {
            color: var(--text-color);
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        .contact-text a:hover {
            color: var(--primary);
        }
        /* Footer */
        footer {
            background-color: var(--dark-transparent);
            padding: 3rem 1.5rem;
            text-align: center;
        }
        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
        }
        .copyright {
            color: var(--gray);
            font-size: 0.85rem;
            margin-top: 1rem;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translate3d(0, 24px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }
        .reveal-on-scroll { opacity: 0; transform: translateY(16px); }
        .reveal-on-scroll.revealed { opacity: 1; transform: translateY(0); animation: fadeInUp 0.6s ease both; }
        @media (min-width: 768px) {
            .about-content {
                grid-template-columns: 1fr 1fr;
            }
            .about-image {
                order: 1;
            }
            .contact-container {
                grid-template-columns: 1fr 1fr;
            }
            .contact-info {
                grid-template-columns: 1fr;
            }
            .nav-links {
                gap: 1.5rem;
            }
        }
        @media (min-width: 992px) {
            .timeline::before {
                left: 50%;
                transform: translateX(-50%);
            }
            .timeline-item {
                padding-left: 0;
                padding-right: calc(50% + 2rem);
                text-align: right;
            }
            .timeline-item:nth-child(even) {
                padding-left: calc(50% + 2rem);
                padding-right: 0;
                text-align: left;
            }
            .timeline-item:nth-child(odd) .timeline-content::before {
                right: -43px;
                left: auto;
            }
            .timeline-item:nth-child(even) .timeline-content::before {
                left: -43px;
            }
        }
        @media (max-width: 576px) {
            .cta-buttons {
                flex-direction: column;
                align-items: center;
            }
            .btn {
                width: 100%;
                max-width: 250px;
                justify-content: center;
            }
            .nav-links {
                gap: 0.5rem;
            }
            a.logo{
                display: none;
            }
            .nav-links a {
                font-size: 0.9rem;
                padding: 0.4rem 0.6rem;
            }
            .logo {
                font-size: 1.3rem;
            }
            section {
                padding: 3rem 1rem;
            }
            .theme-switch{
                transform: scale(0.6);
            }
            .projects-grid {
                min-width: 100vw;
            }
            .project-card {
                min-width: 80vw;
                max-width: 90vw;
            }
        }
        @media (max-width: 400px) {
            nav {
                padding: 0.8rem 1rem;
            }
            .nav-links {
                gap: 0px;
            }
            .nav-links a {
                font-size: 0.8rem;
                padding: 0.3rem 0.3rem;
            }
            .logo {
                font-size: 1.2rem;
            }
            .skill-category {
                padding: 1.2rem;
            }
        }
        @media (max-width:670px) {
            a.logo{
                display: none !important;
            }
        }
    </style>
